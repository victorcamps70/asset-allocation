[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-allocation"
version = "0.1.0"
description = "Asset allocation project"
authors = [
    {name = "Victor Camps", email = "victorcamps70@gmail.com"},
    {name = "Saïd Tellez", email = "tellezsaid@gmail.com"},
    {name = "Steven Yu", email = "stevenyu180@gmail.com"}
]
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
    "seaborn>=0.11",
    "matplotlib>=3.4",
    "scikit-learn>=1.0",
    "jupyter>=1.0",
    "jupyterlab>=3.0",
    "ipython>=7.0",
    "lightgbm>=3.0",
    "xgboost>=1.5",
    "catboost>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]

[tool.setuptools]
packages = {find = {exclude = ["data*", "Report*", ".venv*", ".git*", "tests*"]}}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
